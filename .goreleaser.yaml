version: 2
project_name: yank
before:
  hooks:
    - go mod tidy
builds:
  - id: yank
    main: ./cmd/yank
    binary: yank
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
nfpms:
  - id: deb
    package_name: yank
    formats: [deb]
    maintainer: "Aditya Chaudhary <adityaachaudhary2003@gmail.com>"
    description: "One universal download command for the Linux CLI."
    license: MIT
    bindir: /usr/bin
    recommends: [git, curl, aria2, yt-dlp, rclone]
# Homebrew tap and AUR publishing are deferred until the homebrew-tap repo
# and AUR SSH key exist; re-add with non-deprecated syntax then. v0.1.0 ships
# cross-platform binaries, a .deb, checksums, and a GitHub release.
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
release:
  github:
    owner: adityachaudhary99
    name: yank
